# Builds every package with the same scripts as a local build: Linux
# (packaging/linux/build.sh, offline in a container; smoke-test.sh installs each
# on fresh containers), macOS (packaging/macos/make-dmg.sh with Qt's official
# build) and Windows (packaging/windows/make-installer.sh with Qt's official
# llvm-mingw build). On a v* tag, attaches the packages and the source archives
# to a draft release.
name: Packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian
            pattern: '*.deb'
            test_on: debian ubuntu
          - distro: fedora
            pattern: '*.rpm'
            test_on: fedora
          - distro: arch
            pattern: 'kiln-[0-9]*.pkg.tar.zst'  # not makepkg's kiln-debug-*
            test_on: arch
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: packaging/linux/build.sh ${{ matrix.distro }} dist
      - name: Install and run on fresh containers
        run: |
          for t in ${{ matrix.test_on }}; do
            packaging/linux/smoke-test.sh "$t" dist/${{ matrix.pattern }} dist/screenshots
          done
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-${{ matrix.distro }}
          path: |
            dist/${{ matrix.pattern }}
            dist/screenshots/
      - if: matrix.distro == 'debian'
        uses: actions/upload-artifact@v4
        with:
          name: kiln-sources
          path: |
            dist/kiln-*.tar.gz
            dist/sources/

  macos:
    runs-on: macos-15
    env:
      QT_VERSION: 6.12.0
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          # The newest Xcode on the runner (C23 #embed needs a recent Apple clang).
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          clang --version | head -1
          brew install ninja
      - name: Qt (official build)
        run: pipx run --spec aqtinstall==3.3.0 aqt install-qt mac desktop "$QT_VERSION" clang_64 --archives qtbase -O "$RUNNER_TEMP/qt"
      - name: Build Kiln.app and the disk image
        run: packaging/macos/make-dmg.sh "$RUNNER_TEMP/qt/$QT_VERSION/macos" dist
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-macos
          path: |
            dist/Kiln-*.dmg
            dist/gui-macos.png

  windows:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            make patch
            mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-python
      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Qt and llvm-mingw (pinned)
        run: packaging/windows/fetch-toolchain.sh "$(cygpath -u "$RUNNER_TEMP")/toolchain"
      - name: Build, check and package
        run: |
          t=$(cygpath -u "$RUNNER_TEMP")/toolchain
          packaging/windows/make-installer.sh "$t/qt" "$t/llvm-mingw" dist
      - uses: actions/upload-artifact@v4
        with:
          name: kiln-windows
          path: |
            dist/Kiln-*-x64-setup.exe
            dist/Kiln-*-x64.zip
            dist/gui-windows.png

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, macos, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Source archives (incl. Ventoy's source, not needed by the builds)
        run: cmake -DKILN_DOWNLOAD_DIR="$PWD/artifacts/kiln-sources/sources" -DKILN_WITH_SOURCES=ON
                   -P src/cmake/fetch-third-party.cmake
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          files=$(find artifacts -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' -o -name '*.dmg' -o -name 'Kiln-*-x64*' \
                  -o -name 'kiln-*.tar.gz' -o -path '*/sources/*' \) | sort)
          for f in $files; do (cd "$(dirname "$f")" && sha256sum "$(basename "$f")"); done > SHA256SUMS
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "Kiln ${TAG#v}" --notes ""
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber $files SHA256SUMS
